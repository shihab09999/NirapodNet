<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NirapodNet</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="status-bar">
    <span id="networkStatus" class="offline">
        🔴 Offline
    </span>

    <span id="userLabel"></span>

    <span id="queueCount">Pending: 0</span>
</div>

<div class="container">

    <header>
        <h1>NirapodNet</h1>
        <p>Offline Emergency Communication System</p>
    </header>

    <div id="errorBanner" role="alert" aria-live="polite" style="display:none;"></div>

    <div
        id="broadcastBanner"
        class="broadcast-banner"
        style="display:none;"
    >
        <div id="broadcastPriority"></div>

        <div id="broadcastMessage"></div>

        <button id="broadcastAckButton">
            ACKNOWLEDGE
        </button>
    </div>

    <div id="loginBox">
        <input
            id="usernameInput"
            type="text"
            placeholder="Enter username"
            autocomplete="username"
            minlength="3"
            maxlength="50"
        />


        <button id="joinButton">
            Join Network
        </button>
    </div>


    <div id="chatBox" style="display:none;">
        <section class="sos-section">
            <button id="sosButton" class="sos-button">
                🚨 SEND SOS
            </button>

            <div id="sosStatus" class="sos-status"></div>
        </section>

        <section class="messages" id="messages">
            <div class="message system">
                System online.
            </div>
        </section>

        <section class="composer">

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
            >

            <button id="sendButton">
                Send
            </button>

        </section>
    </div>

</div>

<script src="/static/app.js"></script>

</body>
</html>
